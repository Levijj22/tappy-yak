<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TappyYak</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;
      touch-action: none;
    }
    #wrap {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      background: #fff;
    }
    /* gameArea matches the canvas sky so the strips on either side of the canvas blend in */
    #gameArea { background: linear-gradient(to bottom, #3db9cf, #a5dde9); }

    /* SSW logo overlay — top-left corner of the game area, no background */
    .ssw-logo-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      height: 44px;
      width: auto;
      z-index: 999;
      pointer-events: none;
    }

    #gameArea {
      flex: 2;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      /* sized by fitCanvas() JS */
    }

    /* ── Leaderboard bar (bottom 1/3) ── */
    #lbBar {
      flex: 1;
      min-height: 0;
      display: flex;
      background: #fff;
      border-top: 1px solid rgba(0,0,0,0.08);
    }
    .lb-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 6px 8px;
      overflow: hidden;
    }
    .lb-col + .lb-col {
      border-left: 1px solid rgba(0,0,0,0.08);
    }
    .lb-col-hd {
      font-size: 0.72rem;
      font-weight: 900;
      color: #CC4141;            /* SSW red */
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(204,65,65,0.25);
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .lb-col-list {
      flex: 1;
      list-style: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .lb-col-list li {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.72rem;
      color: #1a1a1a;
      background: rgba(0,0,0,0.035);
      white-space: nowrap;
      overflow: hidden;
    }
    .lb-col-list li.gold   { background: rgba(245,200,66,0.30); }
    .lb-col-list li.silver { background: rgba(160,160,160,0.22); }
    .lb-col-list li.bronze { background: rgba(205,127,50,0.22); }
    .lb-col-list .rank  { width: 22px; font-weight: 900; text-align: center; flex-shrink: 0; font-size: 0.7rem; color: #555; }
    .lb-col-list .lname { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .lb-col-list .lscore{ font-weight: 800; color: #CC4141; flex-shrink: 0; }
    .lb-bar-empty { color: #999; font-size: 0.7rem; text-align: center; padding: 6px 0; }

    /* screens overlay only the gameArea */
    .screen { border-radius: 0; }
    #btnFS, #btnTimer {
      position: absolute;
      top: 10px;
      z-index: 999;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(0,0,0,0.18);
      color: #1a1a1a;
      font-size: 1.1rem;
      height: 36px;
      width: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
      padding: 0;
      font-family: inherit;
    }
    #btnFS    { right: 10px; }
    #btnTimer {
      right: 54px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
    }
    #btnTimer.active { background: #e07820; border-color: #b04010; color: #fff; font-size: 0.65rem; letter-spacing: -0.5px; }
    #btnTimer.locked { background: #CC4141; border-color: #a01010; color: #fff; }

    #lockMsg {
      display: none;
      color: #f88;
      font-size: 1.1rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.4;
    }
    #lockMsg small {
      display: block;
      color: #fcc;
      font-size: 0.78rem;
      font-weight: 500;
      margin-top: 4px;
    }

    /* ---- overlay screens ---- */
    .screen {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      border-radius: 14px;
    }
    .screen.active { display: flex; }

    .title {
      font-size: 5.6rem;       /* 2× */
      font-weight: 900;
      color: #fff;
      text-shadow: 5px 5px 0 #CC4141, 10px 10px 0 #8a1a1a;
      letter-spacing: 4px;
      text-align: center;
      line-height: 1;
    }
    .subtitle {
      color: #fff;
      font-size: 1.9rem;       /* 2× */
      text-align: center;
      opacity: 0.95;
      margin-top: 4px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    }
    .vibe-tag {
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      opacity: 0.85;
      margin-top: -8px;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
    }
    .tap-hint {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .card {
      background: rgba(5,15,30,0.82);
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255,255,255,0.13);
      border-radius: 16px;
      padding: 22px 24px;
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .card-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: #f5c842;
      text-align: center;
    }
    .score-big {
      font-size: 3.4rem;
      font-weight: 900;
      color: #f5c842;
      line-height: 1;
    }
    .score-label {
      color: #999;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: -6px;
    }
    .best-badge {
      background: linear-gradient(135deg,#f5c842,#e07820);
      color: #1a0800;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.35); }
    input[type="text"]:focus { border-color: #f5c842; }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s, filter 0.15s;
      touch-action: manipulation;
      user-select: none;
    }
    button:active { transform: scale(0.96); filter: brightness(0.9); }
    .btn-primary {
      background: linear-gradient(135deg, #f5c842, #e07820);
      color: #1a0800;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #ddd;
      border: 1px solid rgba(255,255,255,0.18);
    }

    /* Menu screen: title+subtitle dropped down a touch — centered ~28% from top */
    #sMenu {
      justify-content: flex-start;
      padding-top: 22%;
    }
    /* Menu screen: float the start-hint card just above the grass, white style */
    #sMenu .card {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 19%;                    /* card center sits ~29% from bottom — halfway between grass top (~12%) and yak's lowest float (~46%) */
      /* width inherits from .card: 100% up to max-width: 300px */
      background: #fff;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      backdrop-filter: none;
    }
    #sMenu .card .tap-hint { color: #1a1a1a; }
    #sMenu .card .btn-secondary {
      background: #f4f4f4;
      color: #1a1a1a;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .error-msg { color: #f88; font-size: 0.8rem; text-align: center; min-height: 1.1em; }

    /* full leaderboard modal */
    .lb-tabs { display:flex; gap:8px; width:100%; }
    .lb-tab {
      flex:1; padding:8px 0; border-radius:8px; border:none; cursor:pointer;
      font-size:0.85rem; font-weight:700; font-family:inherit;
      background:rgba(255,255,255,0.08); color:#aaa; transition:all 0.15s;
    }
    .lb-tab.active { background:linear-gradient(135deg,#f5c842,#e07820); color:#1a0800; }
    .lb-list {
      width:100%; list-style:none; display:flex; flex-direction:column;
      gap:5px; max-height:48vh; overflow-y:auto;
    }
    .lb-list li {
      display:flex; align-items:center; gap:10px; padding:7px 12px;
      background:rgba(255,255,255,0.06); border-radius:8px; color:#ddd; font-size:0.9rem;
    }
    .lb-list li.gold   { background:rgba(245,200,66,0.12); }
    .lb-list li.silver { background:rgba(192,192,192,0.1); }
    .lb-list li.bronze { background:rgba(205,127,50,0.1);  }
    .lb-list .rank  { width:28px; font-weight:900; text-align:center; flex-shrink:0; }
    .lb-list .lname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lb-list .lscore{ font-weight:800; color:#f5c842; }
    .lb-list-empty  { color:#777; font-size:0.85rem; text-align:center; padding:10px 0; }
  </style>
</head>
<body>
<div id="wrap">
  <!-- top: game + overlay screens (banner removed; logo + buttons overlay the game) -->
  <div id="gameArea">
    <canvas id="c" width="400" height="600"></canvas>
    <img class="ssw-logo-overlay" src="/ssw-logo.svg" alt="SSW">
    <button id="btnTimer" title="Start event mode (15-min countdown + mask leaderboard)">⏱️</button>
    <button id="btnFS" title="Fullscreen">⛶</button>

    <!-- MENU -->
    <div id="sMenu" class="screen active">
      <div class="title">TappyYak</div>
      <div class="subtitle">Flap to survive. Don't hit the pipes.</div>
      <div class="vibe-tag">#vibecoded</div>
      <div class="card">
        <div class="tap-hint" id="startHint">✦ Press spacebar to start ✦</div>
        <div id="lockMsg">🔒 Session ended<small>Game is closed</small></div>
        <button class="btn-secondary" id="btnLB">🏆 See Leaderboard</button>
      </div>
    </div>

    <!-- FULL LEADERBOARD -->
    <div id="sLB" class="screen">
      <div class="card" style="max-height:85vh; width:min(360px,90vw)">
        <div class="card-title">🏆 Leaderboard</div>
        <div class="lb-tabs">
          <button class="lb-tab active" id="tabDaily">📅 Today</button>
          <button class="lb-tab" id="tab2Days">🎁 2 Days</button>
          <button class="lb-tab" id="tabAllTime">🌟 All Time</button>
        </div>
        <ul class="lb-list" id="lbList"><li class="lb-list-empty">Loading…</li></ul>
        <button class="btn-secondary" id="btnBack">← Back</button>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="sOver" class="screen">
      <div class="card">
        <div class="card-title">Game Over</div>
        <div class="score-big" id="finalScore">0</div>
        <div class="score-label">YOUR SCORE</div>
        <div id="newBestBadge" class="best-badge" style="display:none">🎉 New Personal Best!</div>
        <input type="text" id="nameInput" placeholder="Your name" maxlength="16"
               autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
        <div class="error-msg" id="errMsg"></div>
        <button class="btn-primary" id="btnSubmit">Submit to Leaderboard</button>
        <button class="btn-secondary" id="btnSkip">Play Again (skip leaderboard)</button>
      </div>
    </div>
  </div>

  <!-- bottom 1/3: live leaderboard -->
  <div id="lbBar">
    <div class="lb-col">
      <div class="lb-col-hd">📅 Today</div>
      <ul class="lb-col-list" id="lbToday"><li class="lb-bar-empty">Loading…</li></ul>
    </div>
    <div class="lb-col">
      <div class="lb-col-hd">🌟 All Time</div>
      <ul class="lb-col-list" id="lbAllTime"><li class="lb-bar-empty">Loading…</li></ul>
    </div>
  </div>
</div>

<script>
/* ── SHA-256 (pure JS, public domain — Geraint Luff) ── */
var sha256 = function sha256(ascii) {
  function rightRotate(value, amount) { return (value>>>amount) | (value<<(32-amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length';
  var i, j, result = '';
  var words = [], asciiBitLength = ascii[lengthProperty]*8;
  var hash = sha256.h = sha256.h || [];
  var k    = sha256.k = sha256.k || [];
  var primeCounter = k[lengthProperty];
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
      k[primeCounter++]  = (mathPow(candidate, 1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while (ascii[lengthProperty]%64 - 56) ascii += '\x00';
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    if (j>>8) return;
    words[i>>2] |= j << ((3 - i)%4)*8;
  }
  words[words[lengthProperty]] = ((asciiBitLength/maxWord)|0);
  words[words[lengthProperty]] = (asciiBitLength);
  for (j = 0; j < words[lengthProperty];) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e&hash[5])^((~e)&hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10))
          )|0
        );
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1 + temp2)|0].concat(hash);
      hash[4] = (hash[4] + temp1)|0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i])|0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) {
    var b = (hash[i]>>(j*8))&255;
    result += ((b < 16) ? 0 : '') + b.toString(16);
  }
  return result;
};

/* ── API helpers (Vercel / GitHub Gist backend) ─── */
let sessionToken      = null;
let sessionChallenge  = null;
let sessionDifficulty = 5;
let sessionNonce      = null;       // PoW solution, computed in background
let sessionReady      = null;       // Promise that resolves when token+nonce ready

function fetchSession() {
  sessionToken = null; sessionChallenge = null; sessionNonce = null;
  sessionReady = fetch('/api/session')
    .then(r => r.json())
    .then(d => {
      sessionToken      = d.token;
      sessionDifficulty = d.difficulty || 5;
      const parts = (sessionToken || '').split('.');
      sessionChallenge = (parts.length === 3) ? parts[1] : null;
      return solvePoW();
    })
    .catch(() => { sessionToken = null; });
  return sessionReady;
}

/* Chunked PoW solver — runs on main thread in small slices so UI stays responsive. */
function solvePoW() {
  return new Promise(resolve => {
    const prefix = '0'.repeat(sessionDifficulty);
    const challenge = sessionChallenge;
    if (!challenge) { resolve(null); return; }
    let n = 0;
    const CHUNK = 3000;
    function work() {
      for (let i = 0; i < CHUNK; i++, n++) {
        if (sha256(challenge + n).startsWith(prefix)) {
          sessionNonce = n;
          resolve(n);
          return;
        }
      }
      setTimeout(work, 0);
    }
    work();
  });
}

async function apiSubmit(name, score, clears) {
  await (sessionReady || fetchSession());
  const res = await fetch('/api/scores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: name.trim(),
      score,
      token: sessionToken,
      nonce: sessionNonce,
      clears
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'submit failed');
  }
}

async function apiFetch(limit = 15, type = 'daily') {
  const res = await fetch(`/api/scores?limit=${limit}&type=${type}`);
  if (!res.ok) throw new Error('fetch failed');
  return res.json();
}

/* ── Canvas setup ───────────────────────────────── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const H = 600;
const landscape = window.innerWidth > window.innerHeight;
/* Portrait: fixed 400px wide.
   Landscape: match the GAME AREA ratio (full width × 2/3 height) so canvas fills edge-to-edge */
const W = landscape
  ? Math.round(H * window.innerWidth / (window.innerHeight * 2 / 3))
  : 400;

/* render at 2× for crisp display on large / retina screens */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

/* ── Yak sprite image ───────────────────────────── */
const yakImg = new Image();
yakImg.src = 'yak-sprite.png';

/* ── Constants ──────────────────────────────────── */
const GRAVITY     = 0.46;     // lighter — falls slower
const FLAP_VEL    = -7.2;     // more lift per tap
const PIPE_W      = 68;
const GROUND_H    = 72;
const BASE_SPEED  = 2.3;
const SPEED_PER_SCORE = 0.13;  // +0.13 px/frame per pipe cleared
const YAK_X       = 90;
const COURSE_SEED = 20250415; // fixed seed → same course every run

/* seeded LCG random (0–1) */
function makeRng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 0xffffffff; };
}

/* Progressive difficulty helpers */
function pipeGap(n)   { return Math.max(130, 215 - n * 3.5); }          // gap shrinks each pipe
function pipeDelay(n) { return Math.max(W * 1.5, W * 4.5 - n * W * 0.06); } // 25% tighter than before

/* ── State ──────────────────────────────────────── */
let state      = 'menu';
let yakY       = H / 2;
let yakVel     = 0;
let score      = 0;
let frame      = 0;
let speed      = BASE_SPEED;
let pipes      = [];
let clouds     = [];
let groundX    = 0;
let lastPipeT  = 0;
let pipeCount  = 0;
let lastTopH   = null;
let rng        = makeRng(COURSE_SEED);
let nextPipeMs = 0;
let animId     = 0;
let idleAnimId = 0;
let clearTimes  = [];      // ms from gameStart for each pipe clear — sent as telemetry
let gameStartMs = 0;

// Personal best (localStorage)
let personalBest = parseInt(localStorage.getItem('ty_best') || '0', 10);

/* ── Sky gradient ───────────────────────────────── */
let skyGrad;
function buildSky() {
  skyGrad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  skyGrad.addColorStop(0, '#3db9cf');
  skyGrad.addColorStop(1, '#a5dde9');
}

/* ── Clouds ─────────────────────────────────────── */
function initClouds() {
  clouds = Array.from({length: 6}, () => ({
    x: Math.random() * W,
    y: 40 + Math.random() * 180,
    rx: 40 + Math.random() * 50,
    ry: 20 + Math.random() * 20,
    s: 0.25 + Math.random() * 0.3
  }));
}
function updateClouds() {
  for (const c of clouds) {
    c.x -= c.s;
    if (c.x + c.rx < 0) {
      c.x = W + c.rx;
      c.y = 40 + Math.random() * 180;
    }
  }
}
function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  for (const c of clouds) {
    /* each ellipse in its own path — avoids the seam caused by the even-odd fill rule */
    ctx.beginPath(); ctx.ellipse(c.x,              c.y,               c.rx,       c.ry,       0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x + c.rx*0.4,  c.y - c.ry*0.45,  c.rx*0.55, c.ry*0.65,  0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x - c.rx*0.35, c.y - c.ry*0.3,   c.rx*0.45, c.ry*0.55,  0, 0, Math.PI*2); ctx.fill();
  }
}

/* ── Background ─────────────────────────────────── */
function drawBg() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H - GROUND_H);
  drawClouds();

  const gx = Math.floor(-groundX % 40) - 40;
  ctx.fillStyle = '#b0743b';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#5aa83a';
  ctx.fillRect(0, H - GROUND_H, W, 22);
  ctx.fillStyle = '#448c28';
  for (let x = gx; x < W + 40; x += 40) {
    ctx.beginPath();
    ctx.arc(x + 4,  H - GROUND_H + 11, 9, Math.PI, 0);
    ctx.arc(x + 18, H - GROUND_H + 8, 12, Math.PI, 0);
    ctx.arc(x + 30, H - GROUND_H + 11, 9, Math.PI, 0);
    ctx.fill();
  }
}

/* ── Yak drawing — sprite image ────────────────── */
// Sprite natural size: 200×173. Draw at ~80px wide centred on (x,y).
const YAK_DRAW_W = 80;
const YAK_DRAW_H = Math.round(YAK_DRAW_W * 173 / 200);

function drawYak(x, y, vel) {
  if (!yakImg.complete || !yakImg.naturalWidth) return; // still loading
  const ang = Math.max(-0.4, Math.min(0.6, vel * 0.045));
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  // draw centred, offset slightly left so face leads
  ctx.drawImage(yakImg, -YAK_DRAW_W * 0.45, -YAK_DRAW_H * 0.55, YAK_DRAW_W, YAK_DRAW_H);
  ctx.restore();
}

/* ── Pipes ──────────────────────────────────────── */
function spawnPipe() {
  const gap    = pipeGap(pipeCount);
  const minTop = 80;
  const maxTop = H - GROUND_H - gap - 80;

  /* smooth height: limit jump from previous pipe, more variation later */
  const maxShift = Math.min(90, 35 + pipeCount * 3);
  let topH;
  if (lastTopH === null) {
    topH = minTop + rng() * (maxTop - minTop);
  } else {
    const lo = Math.max(minTop, lastTopH - maxShift);
    const hi = Math.min(maxTop, lastTopH + maxShift);
    topH = lo + rng() * (hi - lo);
  }

  lastTopH = topH;
  nextPipeMs = pipeDelay(pipeCount);
  pipeCount++;
  pipes.push({ x: W + 20, topH: Math.round(topH), gap, scored: false });
}

function drawPipe(p) {
  const bot  = p.topH + p.gap;
  const botH = H - GROUND_H - bot;
  const capX = p.x - 7;
  const capW = PIPE_W + 14;

  function pipeGrad(x, w) {
    const g = ctx.createLinearGradient(x, 0, x+w, 0);
    g.addColorStop(0,    '#1d5c0e');
    g.addColorStop(0.28, '#2e8c1a');
    g.addColorStop(0.5,  '#48b82c');
    g.addColorStop(0.72, '#2e8c1a');
    g.addColorStop(1,    '#1d5c0e');
    return g;
  }
  function capGrad(x, w) {
    const g = ctx.createLinearGradient(x, 0, x+w, 0);
    g.addColorStop(0,   '#164808');
    g.addColorStop(0.3, '#1d5c0e');
    g.addColorStop(0.7, '#1d5c0e');
    g.addColorStop(1,   '#164808');
    return g;
  }

  // top pipe shaft
  ctx.fillStyle = pipeGrad(p.x, PIPE_W);
  ctx.fillRect(p.x, 0, PIPE_W, p.topH - 22);
  // top cap
  ctx.fillStyle = capGrad(capX, capW);
  ctx.fillRect(capX, p.topH - 24, capW, 26);
  // bottom cap
  ctx.fillStyle = capGrad(capX, capW);
  ctx.fillRect(capX, bot, capW, 26);
  // bottom pipe shaft
  ctx.fillStyle = pipeGrad(p.x, PIPE_W);
  ctx.fillRect(p.x, bot + 26, PIPE_W, botH - 26);

  // outlines
  ctx.strokeStyle = '#164808';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(p.x, 0, PIPE_W, p.topH - 22);
  ctx.strokeRect(capX, p.topH - 24, capW, 26);
  ctx.strokeRect(capX, bot, capW, 26);
  ctx.strokeRect(p.x, bot + 26, PIPE_W, botH - 26);
}

function updatePipes() {
  const now = performance.now();
  if (now - lastPipeT > nextPipeMs) { spawnPipe(); lastPipeT = now; }
  for (const p of pipes) {
    p.x -= speed;
    if (!p.scored && p.x + PIPE_W < YAK_X) {
      p.scored = true; score++;
      clearTimes.push(Math.round(performance.now() - gameStartMs));
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_W + 30 > 0);
}

/* ── Collision ──────────────────────────────────── */
function hit() {
  if (yakY + 14 > H - GROUND_H) return true;
  if (yakY - 14 < 0) return true;
  for (const p of pipes) {
    const capX = p.x - 7, capW = PIPE_W + 14;
    const bot  = p.topH + p.gap;
    if (YAK_X + 24 > capX && YAK_X - 18 < capX + capW) {
      if (yakY - 20 < p.topH || yakY + 20 > bot) return true;
    }
  }
  return false;
}

/* ── Score HUD ──────────────────────────────────── */
function drawHUD() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px -apple-system,sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillText(score, W/2+2, 58);
  ctx.fillStyle = '#fff';
  ctx.fillText(score, W/2, 56);
  ctx.restore();
}

/* ── Main game loop ─────────────────────────────── */
function loop() {
  frame++;
  speed = BASE_SPEED + score * SPEED_PER_SCORE;
  yakVel += GRAVITY;
  yakY   += yakVel;
  groundX += speed;

  updateClouds();
  updatePipes();
  drawBg();
  pipes.forEach(drawPipe);
  drawYak(YAK_X, yakY, yakVel);
  drawHUD();

  if (hit()) { die(); return; }
  animId = requestAnimationFrame(loop);
}

/* ── Game control ───────────────────────────────── */
const COUNTDOWN_MS = 3000;
let countdownStartMs = 0;

function startGame() {
  if (isLocked()) {          // game closed — send user back to menu instead of starting
    showMenu();
    return;
  }
  fetchSession();            // get a fresh anti-tamper token + PoW for this run
  cancelAnimationFrame(idleAnimId);
  cancelAnimationFrame(animId);
  yakY = H / 2; yakVel = 0; score = 0; frame = 0;
  speed = BASE_SPEED; pipes = []; groundX = 0;
  pipeCount = 0; lastTopH = null; rng = makeRng(COURSE_SEED);
  nextPipeMs = pipeDelay(0);
  clearTimes = [];
  // Enter 3-second countdown — yak hovers, no pipes, big number on screen.
  // gameStartMs is set AFTER countdown so telemetry timing is accurate.
  state = 'countdown';
  countdownStartMs = performance.now();
  show(null);
  countdownLoop();
}

function countdownLoop() {
  if (state !== 'countdown') return;
  const elapsed   = performance.now() - countdownStartMs;
  const remaining = COUNTDOWN_MS - elapsed;

  updateClouds();
  drawBg();
  // Yak hovers in starting position with a subtle bob
  const bob = Math.sin(performance.now() * 0.005) * 4;
  drawYak(YAK_X, yakY + bob, 0);
  drawCountdown(remaining);

  if (remaining <= 0) {
    // Transition to live gameplay
    spawnPipe();
    lastPipeT   = performance.now();
    gameStartMs = performance.now();   // telemetry clock starts here
    state = 'playing';
    loop();
    return;
  }
  animId = requestAnimationFrame(countdownLoop);
}

function drawCountdown(remainingMs) {
  const n = Math.ceil(remainingMs / 1000);
  if (n <= 0) return;
  // dim the world slightly
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(0, 0, W, H - GROUND_H);
  // big white number with red outline
  ctx.font = 'bold 140px -apple-system, "Segoe UI", Helvetica, sans-serif';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth   = 10;
  ctx.strokeStyle = '#CC4141';     /* SSW red */
  ctx.strokeText(String(n), W/2, H/2 - 30);
  ctx.fillStyle   = '#fff';
  ctx.fillText(String(n), W/2, H/2 - 30);
  // small label
  ctx.font = 'bold 18px -apple-system, sans-serif';
  ctx.lineWidth = 4;
  ctx.strokeText('GET READY', W/2, H/2 + 60);
  ctx.fillText('GET READY', W/2, H/2 + 60);
  ctx.restore();
}

function flap() {
  if (state === 'playing') { yakVel = FLAP_VEL; }
  else if (state === 'menu') { startGame(); }
  else if (state === 'dead') {
    if (score === 0) { showMenu(); }   // 0 score → back to menu
    else { startGame(); }              // scored something → restart
  }
  // 'dying' → block all input during death animation
}

function showMenu() {
  cancelAnimationFrame(animId);
  state = 'menu';
  show('sMenu');
  updateMenuLockState();
  idleLoop();
}

function die() {
  state = 'dying';  // block input during death animation
  const isNewBest = score > personalBest;
  if (isNewBest) { personalBest = score; localStorage.setItem('ty_best', score); }
  setTimeout(() => {
    if (score === 0) { showMenu(); return; }  // 0 score → straight back to menu
    state = 'dead';
    document.getElementById('finalScore').textContent = score;
    document.getElementById('newBestBadge').style.display = isNewBest ? 'block' : 'none';
    document.getElementById('nameInput').value = '';
    document.getElementById('errMsg').textContent = '';
    document.getElementById('nameInput').style.display = '';
    document.getElementById('btnSubmit').style.display = '';
    show('sOver');
    document.getElementById('nameInput').focus();
  }, 500);
}

/* ── Idle animation on menu ─────────────────────── */
function idleLoop() {
  if (state !== 'menu') return;
  updateClouds();
  drawBg();
  const floatY = H/2 - 10 + Math.sin(Date.now() * 0.0022) * 20;
  drawYak(W/2 - 15, floatY, Math.sin(Date.now() * 0.0022) * 0.2);
  idleAnimId = requestAnimationFrame(idleLoop);
}

/* ── Screen helpers ─────────────────────────────── */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (id) document.getElementById(id).classList.add('active');
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Fit canvas inside gameArea ─────────────────── */
function fitCanvas() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const gameArea = document.getElementById('gameArea');
  const lbBar   = document.getElementById('lbBar');
  const portrait = vh >= vw;

  // Banner = quarter the leaderboard's height. We split the leftover (vh - canvas)
  // into 4/5 leaderboard + 1/5 banner.
  const MIN_LB = 50;   // smaller floor → more cases hit the no-strips full-width path
  let cw, ch, lbH;
  const bH = 0;

  // Try to fit the canvas at full viewport width (aspect-preserving). If the
  // resulting height leaves no room for a usable leaderboard, fall back to
  // aspect-fitting the leftover space (small cyan strips appear in that case).
  const widthScale  = vw / W;
  const chFullWidth = Math.round(H * widthScale);
  if (vh - chFullWidth >= MIN_LB) {
    cw  = vw;
    ch  = chFullWidth;
    lbH = vh - ch;
  } else {
    lbH = MIN_LB;
    const gaH = vh - lbH;
    const scale = Math.min(vw / W, gaH / H);
    cw  = Math.round(W * scale);
    ch  = Math.round(H * scale);
  }

  canvas.style.width    = cw + 'px';
  canvas.style.height   = ch + 'px';
  gameArea.style.flex   = 'none';
  gameArea.style.height = ch + 'px';
  lbBar.style.flex      = 'none';
  lbBar.style.height    = lbH + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/* ── Event mode: timer active OR locked → leaderboard is masked ── */
function lbMaskedNow() { return lockoutAt > 0; }   // either counting or locked

/* ── Game-lockout countdown (15 min) ───────────────── */
const LOCKOUT_MS = 15 * 60 * 1000;
let lockoutAt = parseInt(localStorage.getItem('ty_lockout_at') || '0', 10);
let timerInterval = null;

function isLocked() { return lockoutAt > 0 && Date.now() >= lockoutAt; }

function updateTimerBtn() {
  const btn = document.getElementById('btnTimer');
  if (!btn) return;
  if (lockoutAt === 0) {
    btn.textContent = '⏱️';
    btn.title = 'Start 15-minute countdown';
    btn.classList.remove('active','locked');
    return;
  }
  const remaining = lockoutAt - Date.now();
  if (remaining <= 0) {
    btn.textContent = '🔒';
    btn.title = 'Locked — click to reset';
    btn.classList.remove('active');
    btn.classList.add('locked');
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    updateMenuLockState();
  } else {
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    btn.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
    btn.title = 'Cancel countdown';
    btn.classList.add('active');
    btn.classList.remove('locked');
  }
}

function updateMenuLockState() {
  const hint = document.getElementById('startHint');
  const lockMsg = document.getElementById('lockMsg');
  if (!hint || !lockMsg) return;
  if (isLocked()) {
    hint.style.display = 'none';
    lockMsg.style.display = 'block';
  } else {
    hint.style.display = '';
    lockMsg.style.display = 'none';
  }
}

function startCountdown() {
  lockoutAt = Date.now() + LOCKOUT_MS;
  localStorage.setItem('ty_lockout_at', String(lockoutAt));
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimerBtn, 500);
  updateTimerBtn();
  updateMenuLockState();
  renderLbBar();    // mask leaderboard immediately
}

function cancelCountdown() {
  lockoutAt = 0;
  localStorage.removeItem('ty_lockout_at');
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  updateTimerBtn();
  updateMenuLockState();
  renderLbBar();    // unmask leaderboard immediately
}

document.getElementById('btnTimer').addEventListener('click', e => {
  e.stopPropagation();
  if (lockoutAt > 0) {
    cancelCountdown();
  } else {
    startCountdown();
  }
});

// Resume timer on page load if still running
if (lockoutAt > 0 && !isLocked()) {
  timerInterval = setInterval(updateTimerBtn, 500);
}
updateTimerBtn();
updateMenuLockState();

/* ── Live leaderboard bar ────────────────────────── */
let lbBarData = { daily: [], all: [] };

function renderLbBar() {
  const medals = ['🥇','🥈','🥉'];
  function render(el, rows, emptyMsg) {
    if (!rows.length) { el.innerHTML = `<li class="lb-bar-empty">${emptyMsg}</li>`; return; }
    const masked = lbMaskedNow();
    el.innerHTML = rows.map((r, i) => {
      const cls  = i < 3 ? ['gold','silver','bronze'][i] : '';
      const nm   = masked ? '???' : esc(r.name);
      const sc   = masked ? '?'   : r.score;
      return `<li class="${cls}">
        <span class="rank">${i < 3 ? medals[i] : (i+1)+'.'}</span>
        <span class="lname">${nm}</span>
        <span class="lscore">${sc}</span>
      </li>`;
    }).join('');
  }
  render(document.getElementById('lbToday'),   lbBarData.daily, 'No scores today');
  render(document.getElementById('lbAllTime'), lbBarData.all,   'No scores yet');
}

async function loadLbBar() {
  try {
    const [daily, all] = await Promise.all([apiFetch(10,'daily'), apiFetch(10,'alltime')]);
    lbBarData = { daily, all };
    renderLbBar();
  } catch { /* silent */ }
}
loadLbBar();
setInterval(loadLbBar, 30000);

  e.stopPropagation(); lbType = 'daily'; showLB();
});
document.getElementById('tab2Days').addEventListener('click', e => {
  e.stopPropagation(); lbType = 'last2days'; showLB();
});
document.getElementById('tabAllTime').addEventListener('click', e => {
  e.stopPropagation(); lbType = 'alltime'; showLB();
});
document.getElementById('btnBack').addEventListener('click', e => {
  e.stopPropagation(); show('sMenu');
});

/* ── Events ─────────────────────────────────────── */
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
document.addEventListener('keydown', e => {
  const isSpace = e.code === 'Space';
  const isEnter = e.code === 'Enter';
  const isUp    = e.code === 'ArrowUp';

  if (state === 'dead') {
    if (isSpace || isEnter) {
      e.preventDefault();
      const name = document.getElementById('nameInput').value.trim();
      const btn  = document.getElementById('btnSubmit');
      if (name && !btn.disabled) {
        btn.click();                                    // submit if name filled
      } else {
        startGame();                                    // empty name → just restart
      }
    }
    return; // never flap while dead
  }

  if (isSpace || isUp) { e.preventDefault(); flap(); }
});

document.getElementById('btnSubmit').addEventListener('click', async () => {
  const name = document.getElementById('nameInput').value.trim();
  const err  = document.getElementById('errMsg');
  if (!name) { err.textContent = 'Please enter your name.'; return; }

  const btn = document.getElementById('btnSubmit');
  btn.textContent = 'Submitting…'; btn.disabled = true; err.textContent = '';
  try {
    await apiSubmit(name, score, clearTimes);
    await loadLbBar();
    showMenu();
  } catch (e) {
    console.error('submit error', e);
    err.textContent = `✗ ${e.message || 'Failed to submit.'}`;
  }
  btn.textContent = 'Submit to Leaderboard'; btn.disabled = false;
});

document.getElementById('btnSkip').addEventListener('click', startGame);

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.code === 'Space') {
    e.preventDefault();
    e.stopPropagation(); // don't let Space bubble to global handler
    const name = document.getElementById('nameInput').value.trim();
    const btn  = document.getElementById('btnSubmit');
    if (name && !btn.disabled) {
      btn.click();                                      // submit if name filled
    } else {
      startGame();                                      // empty name → just restart
    }
  }
});

/* ── Fullscreen button ──────────────────────────── */
document.getElementById('btnFS').addEventListener('click', e => {
  e.stopPropagation();
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
  }
});

/* ── Init ───────────────────────────────────────── */
buildSky();
initClouds();
show('sMenu');
state = 'menu';
idleLoop();
</script>
</body>
